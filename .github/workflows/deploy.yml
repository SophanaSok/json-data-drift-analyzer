name: Deploy

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: `npm ci` runs several hundred packages' install scripts,
# and none of them should ever hold a token that can push. The deploy job alone
# gets write, scoped to itself below.
permissions:
  contents: read

# Actions are pinned to commit SHAs because tags are mutable: a compromised or
# re-pointed tag would otherwise ship straight into this workflow. The trailing
# comment records the tag each SHA was resolved from.
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Production dependencies only: dev-tool advisories don't ship to users,
      # and gating on them would block deploys for vulnerabilities that cannot
      # reach the deployed bundle.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # Cache the browser binary rather than downloading ~115 MB on every run.
      # Keyed on the Playwright version so an upgrade fetches a matching browser.
      # The INSTALLED version, not the declared range: a range can resolve to a
      # newer Playwright whose browser build differs, and a stale cache hit would
      # then pair new Playwright with an old browser.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # System dependencies are not cached, so they are installed either way.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The bundle that ships is the bundle that was tested: the e2e webServer's
      # production build (the one the CSP spec ran against) is uploaded here and
      # deployed as-is. The deploy job must never rebuild — a rebuild would ship
      # an artifact no test ever saw, and "which build is live?" would again have
      # no answer.
      - name: Upload site bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize deploys so two rapid pushes cannot race and let the older build
    # win the force-push. Queued, not cancelled: the newest run still lands last.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download tested site bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist
      - uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
