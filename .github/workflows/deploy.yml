name: Deploy

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: `npm ci` runs several hundred packages' install scripts,
# and none of them should ever hold a token that can push. The deploy job alone
# gets write, scoped to itself below.
permissions:
  contents: read

# Actions are pinned to commit SHAs because tags are mutable: a compromised or
# re-pointed tag would otherwise ship straight into this workflow. The trailing
# comment records the tag each SHA was resolved from.
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Production dependencies only: dev-tool advisories don't ship to users,
      # and gating on them would block deploys for vulnerabilities that cannot
      # reach the deployed bundle.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build
      - name: Check bundle budget
        run: node tools/bundle-budget.mjs

      # Cache the browser binary rather than downloading ~115 MB on every run.
      # Keyed on the Playwright version so an upgrade fetches a matching browser.
      # The INSTALLED version, not the declared range: a range can resolve to a
      # newer Playwright whose browser build differs, and a stale cache hit would
      # then pair new Playwright with an old browser.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # System dependencies are not cached, so they are installed either way.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The bundle that ships is the bundle that was tested: the e2e webServer's
      # production build (the one the CSP spec ran against) is uploaded here and
      # deployed as-is. The deploy job must never rebuild — a rebuild would ship
      # an artifact no test ever saw, and "which build is live?" would again have
      # no answer.
      - name: Upload site bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize deploys so two rapid pushes cannot race and let the older build
    # win the force-push. Queued, not cancelled: the newest run still lands last.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download tested site bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
